[project]
name = "system-one"
version = "0.1.0"
description = "System One Models Python SDK"
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = "Apache-2.0"
keywords = []
authors = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/asynq-io/system-one#readme"
Issues = "https://github.com/asynq-io/system-one/issues"
Source = "https://github.com/asynq-io/system-one"

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "docs"},
    "ipython",
]

test = [
    "pytest",
    "pytest-cov",
    "pytest-sugar",
    "pytest-repeat",
    "pytest-timeout",
]

lint = [
    "mypy",
    "ruff",
    "bandit",
]

docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocs-autorefs",
    "mkdocstrings[python]",
    "watchdog",
]

[tool.uv.build-backend]
module-root = ""
module-name = "system_one"

[build-system]
requires = ["uv_build>=0.9.16,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
timeout = 3
addopts = "--cov=./system_one"
testpaths = ["./tests"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "except ImportError:"
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.mypy]
python_version = "3.10"
exclude = [".venv", "^tmp/"]
strict = true
disable_error_code = ["annotation-unchecked"]
follow_imports = "normal"
ignore_missing_imports = true
pretty = true
show_column_numbers = true
show_error_codes = true
warn_no_return = false
warn_unused_ignores = true

[tool.ruff]
target-version = "py310"

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["ALL"]

ignore = [
    "A002",
    "ANN401",
    "B008",     # do not perform function calls in argument defaults
    "COM812",
    "CPY001",
    "D",
    "E501",     # line too long
    "EM101",
    "N818",
    "PLW2901",
    "PTH123",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "SLF001", "PLR2004", "ARG002", "FBT001"]
"examples/*" = ["S101", "ANN001", "ANN201", "INP001", "T201", "EM101", "TRY003"]
"system_one/*" = ["PLC0415"]

[tool.bandit]
skips = ['B101']
